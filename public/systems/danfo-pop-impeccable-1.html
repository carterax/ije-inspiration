<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danfo Pop / Impeccable V1 Split Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:"Chakra Petch",sans-serif}
  nav{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:2px solid var(--ink)}
  .wordmark{font-weight:700;font-size:24px}.wordmark b{color:var(--orange)}
  nav a{background:var(--amber);color:var(--ink);padding:10px 24px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:14px}
  nav a:hover{background:var(--orange);color:var(--cream)}
  .hero{background:var(--orange);color:var(--cream);padding:64px 32px;display:grid;
    grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;min-height:66dvh}
  h1{font-size:clamp(42px,6.6vw,88px);line-height:1.02;font-weight:700;text-transform:uppercase}
  h1 span{color:var(--amber)}
  .sub{margin-top:18px;font-size:17px;max-width:36ch;color:#f6e3d3}
  .cta{margin-top:30px;display:inline-block;background:var(--cream);color:var(--orange);font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;padding:15px 32px;border-radius:4px;text-decoration:none;font-size:15px}
  .cta:hover{background:var(--amber);color:var(--ink)}
  .imgslot{aspect-ratio:4/5;max-height:52dvh;border-radius:8px;border:3px dashed var(--cream);
    display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;padding:20px;color:var(--cream)}
  .schedule{padding:56px 32px}
  .schedule h2{font-size:clamp(24px,3.2vw,36px);font-weight:700;text-transform:uppercase;margin-bottom:24px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-top:2px solid var(--ink);gap:16px;flex-wrap:wrap}
  .row:last-child{border-bottom:2px solid var(--ink)}
  .row .name{font-weight:600;font-size:19px;text-transform:uppercase}
  .row .day{font-family:"JetBrains Mono";font-size:12px;color:var(--orange);letter-spacing:.1em}
  .row a{color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px}
  .row a:hover{color:var(--orange)}
  @media(max-width:760px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="wordmark">IJE<b>.</b></div><a href="#">Get a seat</a></nav>
<section class="hero">
  <div>
    <h1>The best table <span>hasn't met yet.</span></h1>
    <p class="sub">Six strangers. One evening in Lagos. See what happens.</p>
    <a class="cta" href="#">Get a seat</a>
  </div>
  <!-- HIGGSFIELD: [SUBJECT: rear of a Lagos danfo bus, hand-painted lettering and stickers, no people]
       warm amber grade, poster crop, film grain. 4:5 -->
  <div class="imgslot">IMAGE SLOT<br>danfo tailgate detail, no people<br>4:5</div>
</section>
<section class="schedule">
  <h2>Pick your night</h2>
  <div class="row"><span class="name">Dinner club</span><span class="day">THURSDAY</span><a href="#">Reserve</a></div>
  <div class="row"><span class="name">Card night</span><span class="day">FRIDAY</span><a href="#">Reserve</a></div>
  <div class="row"><span class="name">Rooftop hang</span><span class="day">SATURDAY</span><a href="#">Reserve</a></div>
</section>
<script src="variants-nav.js"></script>
</body>
</html>
