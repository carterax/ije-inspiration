<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danfo Pop / Impeccable V4 Photo Ground</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:"Chakra Petch",sans-serif}
  .hero{min-height:calc(86dvh - 46px);border-radius:10px;margin:16px;position:relative;
    background:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .hero .slotlbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .hero .slotlbl i{border:3px dashed var(--amber);color:var(--amber);padding:18px 24px;font-style:normal;
    font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-align:center}
  .hero-copy{position:relative;z-index:2;padding:32px;background:linear-gradient(transparent, rgba(17,24,39,.7))}
  .hero-copy h1{font-size:clamp(40px,6.4vw,88px);line-height:1;text-transform:uppercase;font-weight:700;color:var(--cream)}
  .hero-copy h1 span{color:var(--amber)}
  .hero-copy .cta{margin-top:20px;display:inline-block;background:var(--amber);color:var(--ink);
    font-weight:700;font-size:15px;text-transform:uppercase;padding:14px 30px;border-radius:4px;text-decoration:none}
  .hero-copy .cta:hover{background:var(--cream)}
  .gallery{padding:8px 16px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .g{border-radius:8px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:14px}
  .g1{background:var(--amber);color:var(--ink)}
  .g2{background:var(--orange);color:var(--cream)}
  .g3{background:var(--ink);color:var(--cream)}
  .g i{border:2px dashed currentColor;padding:12px 16px;font-style:normal}
  .bar{margin:0 16px 16px;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:20px 24px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .bar b{font-size:clamp(18px,2.4vw,26px);text-transform:uppercase;font-weight:700}
  .bar b span{color:var(--orange)}
  .bar a{background:var(--orange);color:var(--cream);padding:12px 26px;border-radius:4px;text-decoration:none;
    font-weight:600;text-transform:uppercase;font-size:13px}
  .bar a:hover{background:var(--amber);color:var(--ink)}
  @media(max-width:700px){.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- HIGGSFIELD: [SUBJECT: overhead flat lay of six empty plates, six glasses, deck of cards and candles on wood, no people]
     warm amber grade, film grain, soft candle light. 16:9 -->
<section class="hero">
  <div class="slotlbl"><i>HERO IMAGE SLOT<br>overhead: six plates, glasses, cards, candles<br>16:9 · no people</i></div>
  <div class="hero-copy">
    <h1>The best table in Lagos <span>hasn't met yet.</span></h1>
    <a class="cta" href="#">Get a seat</a>
  </div>
</section>
<section class="gallery">
  <!-- HIGGSFIELD: [SUBJECT: hand-painted danfo lettering close-up, no people] amber duotone. 4:3 -->
  <div class="g g1"><i>SLOT · danfo lettering<br>4:3</i></div>
  <!-- HIGGSFIELD: [SUBJECT: worn playing cards fanned on wood, warm light, no people] orange duotone. 4:3 -->
  <div class="g g2"><i>SLOT · cards after a game<br>4:3</i></div>
  <!-- HIGGSFIELD: [SUBJECT: lit candle beside two glasses, dark ground, no people] ink and amber. 4:3 -->
  <div class="g g3"><i>SLOT · candle and glasses<br>4:3</i></div>
</section>
<div class="bar">
  <b>Six strangers. One evening. <span>See what happens.</span></b>
  <a href="#">Get a seat</a>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
