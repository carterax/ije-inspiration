<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danfo Pop / Taste V1 Split Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--yellow:#f2c200;--ink:#191308;--red:#d43d17;--blue:#274690;--cream:#f6efdc}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--yellow);color:var(--ink);font-family:"Space Grotesk",sans-serif;
    background-image:radial-gradient(rgba(25,19,8,.13) 1.2px, transparent 1.2px);background-size:14px 14px}
  .frame{min-height:calc(100dvh - 46px);display:flex;flex-direction:column;border:6px solid var(--ink)}
  nav{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:6px solid var(--ink)}
  .wordmark{font-family:Anton;font-size:28px}.wordmark span{color:var(--red)}
  nav a{background:var(--ink);color:var(--yellow);padding:10px 22px;text-decoration:none;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;font-size:13px}
  nav a:active{transform:translateY(1px)}
  .hero{flex:1;display:grid;grid-template-columns:1.4fr 1fr}
  .hero-copy{padding:56px 40px;display:flex;flex-direction:column;justify-content:center}
  h1{font-family:Anton;font-size:clamp(52px,8.4vw,116px);line-height:.92;text-transform:uppercase}
  h1 .knock{-webkit-text-stroke:3px var(--ink);color:transparent}
  .sub{margin-top:22px;font-size:18px;max-width:34ch;font-weight:500}
  .cta{margin-top:34px;display:inline-block;width:max-content;background:var(--red);color:var(--cream);
    font-family:Anton;font-size:20px;text-transform:uppercase;padding:16px 34px;text-decoration:none;
    box-shadow:6px 6px 0 var(--ink)}
  .cta:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .imgslot{border-left:6px solid var(--ink);background:var(--red);display:flex;align-items:center;
    justify-content:center;position:relative;min-height:320px}
  .imgslot .lbl{border:2px dashed var(--cream);color:var(--cream);padding:16px 20px;text-align:center;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;max-width:80%}
  .strip{border-top:6px solid var(--ink);background:var(--cream);padding:36px 28px}
  .strip h2{font-family:Anton;text-transform:uppercase;font-size:clamp(24px,3.2vw,38px);margin-bottom:22px}
  .nights{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .night{border:3px solid var(--ink);padding:18px;margin:-1.5px;font-weight:700;text-transform:uppercase;
    display:flex;justify-content:space-between;transition:background .15s}
  .night:hover{background:var(--yellow)}
  .night em{font-style:normal;font-size:12px;color:var(--red)}
  @media(max-width:760px){.hero{grid-template-columns:1fr}.imgslot{border-left:0;border-top:6px solid var(--ink)}}
</style>
</head>
<body>
<div class="frame">
  <nav><div class="wordmark">IJE<span>*</span></div><a href="#">Get a seat</a></nav>
  <div class="hero">
    <div class="hero-copy">
      <h1>The best table<br><span class="knock">hasn't met yet.</span></h1>
      <p class="sub">Six strangers. One evening in Lagos. See what happens.</p>
      <a class="cta" href="#">Get a seat</a>
    </div>
    <!-- HIGGSFIELD: [SUBJECT: rear of a Lagos danfo bus, hand-painted lettering and stickers, no people]
         screenprint poster treatment, danfo yellow and red, thick black outlines, halftone texture, flat graphic -->
    <div class="imgslot"><div class="lbl">IMAGE SLOT<br>danfo tailgate detail, no people<br>4:5</div></div>
  </div>
  <div class="strip">
    <h2>Pick your night</h2>
    <div class="nights">
      <div class="night">Dinner club <em>THU</em></div>
      <div class="night">Card night <em>FRI</em></div>
      <div class="night">Rooftop hang <em>SAT</em></div>
      <div class="night">Market crawl <em>SUN</em></div>
    </div>
  </div>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
