<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gele Studio / Impeccable V3 Type Gilded</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@200;300;400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--green:#1d4f43;--deep:#143b32}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--green);color:var(--cream);font-family:"Chakra Petch",sans-serif;
    background-image:radial-gradient(900px 600px at 50% 30%, rgba(204,136,0,.1), transparent 65%)}
  .page{min-height:calc(100dvh - 46px);display:flex;flex-direction:column;padding:0 clamp(24px,6vw,72px)}
  nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
  .wordmark{font-weight:700;font-size:24px;letter-spacing:.2em}
  nav a{background:var(--amber);color:var(--ink);padding:11px 26px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  nav a:hover{background:var(--cream)}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .rule{width:70px;height:2px;background:var(--amber);margin:0 auto}
  h1{margin:24px auto;font-weight:200;line-height:1.14;font-size:clamp(40px,6.6vw,94px);max-width:14ch;
    text-transform:uppercase}
  h1 b{font-weight:700;color:var(--amber)}
  .sub{font-size:15px;font-weight:300;color:#cfddd3;max-width:42ch;margin:0 auto;line-height:1.8}
  .foot{display:flex;justify-content:center;align-items:center;gap:26px;padding:36px 0 44px;flex-wrap:wrap}
  .mono{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#9db3a7}
  .cta{background:var(--orange);color:var(--cream);padding:15px 38px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
  .cta:hover{background:var(--amber);color:var(--ink)}
</style>
</head>
<body>
<div class="page">
  <nav><div class="wordmark">IJE</div><a href="#">Reserve</a></nav>
  <section class="hero">
    <div class="rule"></div>
    <h1>Dress for strangers <b>worth impressing.</b></h1>
    <p class="sub">Six seats. Deep green rooms. Gold light. One evening that deserves your good outfit.</p>
  </section>
  <div class="foot">
    <span class="mono">Thursday · Seven</span>
    <a class="cta" href="#">Reserve a seat</a>
    <span class="mono">Lagos · Dressed</span>
  </div>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
