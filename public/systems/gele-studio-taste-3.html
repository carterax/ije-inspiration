<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gele Studio / Taste V3 Type Gilded</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--green:#1d4f43;--deep:#143b32;--gold:#c99a4b;--pearl:#f1e8d8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--green);color:var(--pearl);font-family:Outfit,sans-serif;
    background-image:radial-gradient(900px 600px at 50% 30%, rgba(201,154,75,.08), transparent 65%)}
  .page{min-height:calc(100dvh - 46px);display:flex;flex-direction:column;padding:0 clamp(24px,6vw,72px)}
  nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
  .wordmark{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:600;letter-spacing:.24em}
  nav a{color:var(--deep);background:var(--gold);padding:11px 26px;text-decoration:none;font-weight:500;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  nav a:hover{background:var(--pearl)}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .rule{width:70px;height:1px;background:var(--gold);margin:0 auto}
  h1{margin:26px auto;font-family:"Cormorant Garamond",serif;font-weight:500;line-height:1.14;
    font-size:clamp(44px,7vw,100px);max-width:14ch}
  h1 em{font-style:italic;color:var(--gold)}
  .sub{font-size:15px;font-weight:300;color:#cfddd3;max-width:42ch;margin:0 auto;line-height:1.8;
    letter-spacing:.04em}
  .foot{display:flex;justify-content:center;align-items:center;gap:26px;padding:36px 0 44px;flex-wrap:wrap}
  .mono{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#9db3a7}
  .cta{border:1px solid var(--gold);color:var(--gold);padding:14px 38px;text-decoration:none;
    font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  .cta:hover{background:var(--gold);color:var(--deep)}
</style>
</head>
<body>
<div class="page">
  <nav><div class="wordmark">IJE</div><a href="#">Reserve</a></nav>
  <section class="hero">
    <div class="rule"></div>
    <h1>Dress for strangers <em>worth impressing.</em></h1>
    <p class="sub">Six seats. Deep green rooms. Gold light. One evening that deserves your good outfit.</p>
  </section>
  <div class="foot">
    <span class="mono">Thursday · Seven</span>
    <a class="cta" href="#">Reserve a seat</a>
    <span class="mono">Lagos · Dressed</span>
  </div>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
