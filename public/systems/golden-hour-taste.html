<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour Film / Taste</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--dusk:#2b1f16;--gold:#d9903f;--haze:#e8c48e;--cream:#f4e9d6;--palm:#4a4030}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--dusk);color:var(--cream);font-family:Sora,sans-serif}
  .frame{min-height:100dvh;display:flex;flex-direction:column}
  .photo{flex:1;min-height:70dvh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
    background:
      radial-gradient(800px 500px at 50% 96%, rgba(217,144,63,.85), transparent 65%),
      linear-gradient(180deg,#3d2c1c 0%, #6b4a26 40%, #b5773a 78%, #d9903f 100%)}
  .photo::before{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;
    background:radial-gradient(3px 90px at 12% 30%, var(--palm) 60%, transparent),
      radial-gradient(3px 70px at 18% 24%, var(--palm) 60%, transparent),
      radial-gradient(4px 110px at 86% 26%, var(--palm) 60%, transparent),
      radial-gradient(3px 80px at 92% 34%, var(--palm) 60%, transparent)}
  .photo::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
    background:repeating-radial-gradient(circle at 40% 30%, transparent 0 2px, rgba(0,0,0,.6) 2px 3px)}
  .grade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(43,31,22,.55) 0%, transparent 35%)}
  nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:24px clamp(24px,5vw,56px);z-index:3}
  .wordmark{font-weight:600;font-size:20px;letter-spacing:.34em}
  nav a{color:var(--cream);border:1px solid rgba(244,233,214,.6);padding:11px 26px;border-radius:999px;
    text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  nav a:hover{background:var(--cream);color:var(--dusk)}
  .hero-copy{position:relative;z-index:2;padding:0 clamp(24px,5vw,56px) 56px;max-width:760px}
  .roll{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--haze)}
  h1{margin-top:14px;font-size:clamp(34px,5vw,62px);font-weight:200;line-height:1.16}
  h1 b{font-weight:600}
  .cta{margin-top:28px;display:inline-block;background:var(--cream);color:var(--dusk);padding:14px 34px;
    border-radius:999px;text-decoration:none;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  .cta:hover{background:var(--gold);color:var(--dusk)}
  .contact-sheet{background:var(--dusk);padding:40px clamp(24px,5vw,56px) 64px}
  .contact-sheet h2{font-weight:300;font-size:clamp(22px,2.8vw,32px)}
  .strip{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .neg{aspect-ratio:3/2;border:1px solid rgba(244,233,214,.25);position:relative;overflow:hidden}
  .neg:nth-child(1){background:linear-gradient(200deg,#8a5a2c,#3d2c1c)}
  .neg:nth-child(2){background:linear-gradient(160deg,#b5773a,#57381c)}
  .neg:nth-child(3){background:linear-gradient(180deg,#6b4a26,#2b1f16)}
  .neg:nth-child(4){background:linear-gradient(220deg,#d9903f,#6b4a26)}
  .neg span{position:absolute;bottom:8px;left:10px;font-family:"IBM Plex Mono";font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:rgba(244,233,214,.8)}
  @media(max-width:700px){.photo{min-height:60dvh}}
</style>
</head>
<body>
<div class="frame">
  <div class="photo">
    <div class="grade"></div>
    <nav><div class="wordmark">IJE</div><a href="#">Join a roll</a></nav>
    <div class="hero-copy">
      <div class="roll">Roll 07 · Lagos · Golden hour</div>
      <h1>Some nights develop <b>into people you keep.</b></h1>
      <a class="cta" href="#">Join this week's roll</a>
    </div>
  </div>
  <section class="contact-sheet">
    <h2>Contact sheet, last week</h2>
    <div class="strip">
      <div class="neg"><span>07A · The arrival</span></div>
      <div class="neg"><span>12A · Second course</span></div>
      <div class="neg"><span>19A · The argument</span></div>
      <div class="neg"><span>24A · Nobody left</span></div>
    </div>
  </section>
</div>
</body>
</html>
