<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Mask / Impeccable V3 Type Unmasked</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@200;300;400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--void:#17130e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--void);color:var(--cream);font-family:"Chakra Petch",sans-serif}
  .page{min-height:calc(100dvh - 46px);display:flex;flex-direction:column;padding:0 clamp(24px,6vw,72px);
    position:relative;overflow:hidden}
  .beam{position:absolute;left:8%;top:-20%;width:340px;height:150%;transform:rotate(16deg);pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(204,136,0,.1) 45%, rgba(204,136,0,.1) 55%, transparent)}
  nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;position:relative;z-index:1}
  .wordmark{font-weight:700;font-size:20px;letter-spacing:.28em}
  nav a{background:var(--amber);color:var(--ink);padding:11px 26px;border-radius:4px;text-decoration:none;
    font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  nav a:hover{background:var(--cream)}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
  h1{font-weight:200;font-size:clamp(36px,6.4vw,90px);line-height:1.12;max-width:16ch}
  h1 .mask{color:#5a4d38}
  h1 .true{font-weight:700;color:var(--cream)}
  h1 .true em{font-style:normal;color:var(--amber)}
  .sub{margin-top:22px;font-size:15px;color:#c9bda6;font-weight:300;max-width:42ch;line-height:1.7}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
    padding:30px 0 38px;position:relative;z-index:1}
  .mono{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9a8a6a}
  .cta{background:var(--orange);color:var(--cream);padding:15px 36px;border-radius:4px;text-decoration:none;
    font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .cta:hover{background:var(--amber);color:var(--ink)}
</style>
</head>
<body>
<div class="page">
  <div class="beam" aria-hidden="true"></div>
  <nav><div class="wordmark">IJE</div><a href="#">Take a seat</a></nav>
  <section class="hero">
    <h1>
      <span class="mask">Fine, thanks. Busy week. You know how it is.</span><br>
      <span class="true">Now say the <em>true thing.</em></span>
    </h1>
    <p class="sub">Six strangers, one table, zero rehearsed answers. Lagos, Thursday, 7 PM.</p>
  </section>
  <div class="foot">
    <span class="mono">Museum of dropped masks · Est. 2026</span>
    <a class="cta" href="#">Take a seat</a>
  </div>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
