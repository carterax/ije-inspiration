<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papercut / Impeccable V3 Type Torn</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--surface:#FFFFFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--cream);font-family:"Chakra Petch",sans-serif}
  .page{min-height:calc(100dvh - 46px);display:flex;flex-direction:column}
  nav{display:flex;justify-content:space-between;align-items:center;padding:22px 32px}
  .wordmark{font-weight:700;font-size:22px;background:var(--amber);color:var(--ink);padding:4px 12px;
    transform:rotate(-1.6deg)}
  nav a{background:var(--orange);color:var(--cream);padding:11px 24px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:14px}
  nav a:hover{background:var(--amber);color:var(--ink)}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 32px;gap:14px}
  .strip{display:inline-block;width:max-content;max-width:100%;font-weight:700;text-transform:uppercase;
    line-height:1;font-size:clamp(38px,7.2vw,98px);padding:12px 26px}
  .st1{background:var(--cream);color:var(--ink);transform:rotate(-1.4deg);
    clip-path:polygon(0 12%, 3% 0, 98% 4%, 100% 90%, 96% 100%, 2% 96%)}
  .st2{background:var(--amber);color:var(--ink);transform:rotate(1deg);margin-left:6%;
    clip-path:polygon(2% 0, 100% 8%, 97% 100%, 0 94%)}
  .st3{background:var(--orange);color:var(--cream);transform:rotate(-.7deg);margin-left:2%;
    clip-path:polygon(0 6%, 97% 0, 100% 92%, 3% 100%)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 32px 40px}
  .mono{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9aa2b5}
  .cta{background:var(--cream);color:var(--orange);padding:15px 34px;text-decoration:none;font-weight:700;
    font-size:15px;text-transform:uppercase;border-radius:4px;transform:rotate(-.8deg)}
  .cta:hover{background:var(--amber);color:var(--ink);transform:rotate(0)}
</style>
</head>
<body>
<div class="page">
  <nav><div class="wordmark">IJE</div><a href="#">Add your piece</a></nav>
  <section class="hero">
    <span class="strip st1">Six strangers.</span>
    <span class="strip st2">One evening.</span>
    <span class="strip st3">See what happens.</span>
  </section>
  <div class="foot">
    <span class="mono">Torn weekly · Lagos · Thursday 7 PM</span>
    <a class="cta" href="#">Add your piece</a>
  </div>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
