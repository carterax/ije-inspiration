<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papercut / Taste V1 Split Scraps</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--kraft:#c9b797;--paper:#efe9db;--ink:#26221a;--teal:#7fa093;--mustard:#d9a91f;--brick:#bf4f30}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--kraft);color:var(--ink);font-family:Archivo,sans-serif;overflow-x:hidden;
    background-image:linear-gradient(rgba(38,34,26,.05) 1px, transparent 1px);background-size:100% 28px}
  .wrap{max-width:1150px;margin:0 auto;padding:0 32px 64px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
  .wordmark{font-weight:900;font-size:24px;background:var(--paper);padding:6px 14px;transform:rotate(-2deg);
    box-shadow:2px 3px 0 rgba(38,34,26,.25)}
  nav a{background:var(--ink);color:var(--paper);padding:11px 24px;text-decoration:none;font-weight:700;font-size:14px;
    transform:rotate(1.4deg);display:inline-block}
  nav a:hover{transform:rotate(0deg)}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:44px 0;min-height:64dvh}
  h1{font-size:clamp(38px,5.8vw,74px);font-weight:900;line-height:1.06;text-transform:uppercase}
  h1 .scrap{display:inline-block;padding:8px 20px;margin:5px 0}
  h1 .s1{background:var(--paper);transform:rotate(-1.6deg);clip-path:polygon(1% 8%, 99% 0, 100% 88%, 2% 100%)}
  h1 .s2{background:var(--mustard);transform:rotate(1.2deg);clip-path:polygon(0 0, 100% 6%, 98% 100%, 1% 92%)}
  .sub{margin-top:20px;font-size:16px;max-width:36ch;font-weight:500;background:var(--paper);display:inline-block;
    padding:13px 17px;transform:rotate(.6deg);box-shadow:2px 3px 0 rgba(38,34,26,.2)}
  .cta{margin-top:26px;display:block;width:max-content;background:var(--brick);color:var(--paper);font-weight:900;
    text-transform:uppercase;padding:15px 32px;text-decoration:none;font-size:15px;transform:rotate(-1deg);
    clip-path:polygon(2% 6%, 98% 0, 100% 92%, 0 100%)}
  .cta:hover{transform:rotate(0) scale(1.02)}
  .pile{justify-self:center;width:min(100%,420px);position:relative;aspect-ratio:4/5}
  .imgslot{position:absolute;background:var(--paper);padding:10px;box-shadow:3px 4px 0 rgba(38,34,26,.2)}
  .imgslot i{display:flex;align-items:center;justify-content:center;border:2px dashed var(--ink);
    font-style:normal;font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#6d645f;text-align:center;padding:10px;width:100%;height:100%}
  .sl1{width:62%;aspect-ratio:3/4;left:0;top:4%;transform:rotate(-4deg);
    clip-path:polygon(1% 3%, 99% 0, 100% 97%, 0 100%)}
  .sl2{width:52%;aspect-ratio:1;right:0;top:0;transform:rotate(5deg);
    clip-path:polygon(0 0, 100% 4%, 97% 100%, 2% 96%)}
  .sl3{width:58%;aspect-ratio:4/3;right:6%;bottom:2%;transform:rotate(-2deg);
    clip-path:polygon(2% 0, 100% 6%, 98% 100%, 0 94%)}
  @media(max-width:840px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="wordmark">IJE</div><a href="#">Add your piece</a></nav>
  <section class="hero">
    <div>
      <h1><span class="scrap s1">Different scraps.</span><br><span class="scrap s2">One picture.</span></h1>
      <p class="sub">Six strangers pieced together over dinner in Lagos. The edges don't have to match.</p>
      <a class="cta" href="#">Add your piece</a>
    </div>
    <!-- HIGGSFIELD per slot: torn-edged photo scraps, warm analog texture, no people -->
    <div class="pile" aria-label="Collage of image slots">
      <div class="imgslot sl1"><i>SLOT · torn kraft paper macro · 3:4</i></div>
      <div class="imgslot sl2"><i>SLOT · collage elements flat lay · 1:1</i></div>
      <div class="imgslot sl3"><i>SLOT · six plates overhead, torn edges · 4:3</i></div>
    </div>
  </section>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
