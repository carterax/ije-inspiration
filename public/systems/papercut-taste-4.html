<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papercut / Taste V4 Photo Collage</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--kraft:#c9b797;--paper:#efe9db;--ink:#26221a;--teal:#7fa093;--mustard:#d9a91f;--brick:#bf4f30}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--kraft);color:var(--ink);font-family:Archivo,sans-serif;overflow-x:hidden}
  .wrap{max-width:1150px;margin:0 auto;padding:0 32px 72px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
  .wordmark{font-weight:900;font-size:24px;background:var(--paper);padding:6px 14px;transform:rotate(-2deg);
    box-shadow:2px 3px 0 rgba(38,34,26,.25)}
  nav a{background:var(--ink);color:var(--paper);padding:11px 24px;text-decoration:none;font-weight:700;
    font-size:14px;transform:rotate(1.2deg);display:inline-block}
  .canvas{position:relative;min-height:76dvh;margin-top:16px}
  .headline{position:absolute;left:0;top:34%;z-index:3;max-width:52%}
  h1{font-size:clamp(34px,5vw,62px);font-weight:900;line-height:1.06;text-transform:uppercase;
    background:var(--paper);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;
    padding:6px 14px;box-shadow:3px 4px 0 rgba(38,34,26,.25)}
  h1 em{font-style:normal;color:var(--brick)}
  .cta{position:absolute;left:0;top:calc(34% + 150px);z-index:3;background:var(--brick);color:var(--paper);
    font-weight:900;text-transform:uppercase;padding:15px 32px;text-decoration:none;font-size:15px;
    transform:rotate(-1.2deg);clip-path:polygon(2% 6%, 98% 0, 100% 92%, 0 100%)}
  .shard{position:absolute;background:var(--paper);padding:10px;box-shadow:4px 5px 0 rgba(38,34,26,.22)}
  .shard i{display:flex;align-items:center;justify-content:center;width:100%;height:calc(100% - 0px);
    border:2px dashed var(--ink);font-style:normal;font-family:"IBM Plex Mono";font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:#6d645f;text-align:center;padding:10px}
  .h1{width:34%;aspect-ratio:3/4;right:22%;top:0;transform:rotate(4deg);
    clip-path:polygon(1% 2%, 99% 0, 100% 98%, 0 100%)}
  .h2{width:26%;aspect-ratio:1;right:0;top:14%;transform:rotate(-6deg);
    clip-path:polygon(0 4%, 97% 0, 100% 96%, 3% 100%)}
  .h3{width:30%;aspect-ratio:4/3;right:30%;bottom:10%;transform:rotate(-3deg);
    clip-path:polygon(2% 0, 100% 4%, 98% 100%, 0 96%)}
  .h4{width:24%;aspect-ratio:3/4;right:2%;bottom:0;transform:rotate(5deg);
    clip-path:polygon(0 2%, 98% 0, 100% 97%, 2% 100%)}
  .h5{width:20%;aspect-ratio:1;left:38%;top:2%;transform:rotate(-7deg);
    clip-path:polygon(3% 0, 100% 5%, 97% 100%, 0 95%)}
  @media(max-width:820px){.canvas{min-height:0;display:flex;flex-direction:column;gap:18px}
    .headline,.cta{position:static;max-width:100%}
    .shard{position:static;width:100%!important;transform:none!important;aspect-ratio:4/3}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="wordmark">IJE</div><a href="#">Add your piece</a></nav>
  <!-- HIGGSFIELD per shard: torn-edged photo scrap, warm analog print texture, no people -->
  <section class="canvas">
    <div class="headline"><h1>Torn from <em>the same city.</em></h1></div>
    <a class="cta" href="#">Add your piece</a>
    <div class="shard h1"><i>SLOT · danfo yellow detail, torn scrap · 3:4</i></div>
    <div class="shard h2"><i>SLOT · jollof pot overhead · 1:1</i></div>
    <div class="shard h3"><i>SLOT · cards on wood table · 4:3</i></div>
    <div class="shard h4"><i>SLOT · string lights at night · 3:4</i></div>
    <div class="shard h5"><i>SLOT · torn newsprint texture · 1:1</i></div>
  </section>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
