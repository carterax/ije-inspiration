<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Party 99 / Impeccable</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--surface:#FFFFFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--cream);font-family:"Chakra Petch",sans-serif;overflow-x:hidden;
    background-image:linear-gradient(rgba(247,240,227,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247,240,227,.06) 1px, transparent 1px);background-size:44px 44px}
  .wrap{max-width:1150px;margin:0 auto;padding:0 32px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
  .wordmark{font-weight:700;font-style:italic;font-size:26px;background:var(--amber);color:var(--ink);
    padding:4px 16px;transform:rotate(-2deg);border-radius:6px}
  nav a{background:var(--orange);color:var(--cream);padding:12px 26px;text-decoration:none;font-weight:700;
    font-size:14px;text-transform:uppercase;letter-spacing:.05em;border-radius:999px}
  nav a:hover{background:var(--amber);color:var(--ink)}
  .hero{padding:56px 0 48px;position:relative;min-height:60dvh}
  h1{font-weight:700;font-style:italic;font-size:clamp(48px,8vw,108px);line-height:1;text-transform:uppercase}
  h1 .a{color:var(--cream)}
  h1 .b{color:var(--amber)}
  .sub{margin-top:22px;font-size:17px;max-width:36ch;font-weight:300;line-height:1.6;color:#d1d5db}
  .cta{margin-top:30px;display:inline-block;background:var(--amber);color:var(--ink);padding:16px 34px;
    text-decoration:none;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;border-radius:999px}
  .cta:hover{background:var(--cream)}
  .stickers{position:absolute;right:0;top:48px;width:270px;height:320px;pointer-events:none}
  .stk{position:absolute;font-weight:700;text-transform:uppercase;font-style:italic;border-radius:999px;
    padding:12px 20px;font-size:14px}
  .s1{background:var(--orange);color:var(--cream);top:10px;right:100px;transform:rotate(7deg)}
  .s2{background:var(--amber);color:var(--ink);top:100px;right:8px;transform:rotate(-6deg)}
  .s3{background:var(--cream);color:var(--ink);top:190px;right:70px;transform:rotate(4deg)}
  .crew{background:var(--cream);color:var(--ink);margin:32px -100vw 0;padding:56px 100vw 72px}
  .crew h2{font-weight:700;font-style:italic;text-transform:uppercase;font-size:clamp(26px,3.6vw,42px)}
  .row{margin-top:26px;display:flex;gap:18px;flex-wrap:wrap}
  .polaroid{flex:1 1 200px;background:var(--surface);border-radius:6px;padding:12px 12px 16px;
    box-shadow:0 6px 18px rgba(17,24,39,.15)}
  .polaroid:nth-child(1){transform:rotate(-1.6deg)}
  .polaroid:nth-child(2){transform:rotate(1.2deg)}
  .polaroid:nth-child(3){transform:rotate(-.8deg)}
  .polaroid .ph{aspect-ratio:1;border-radius:3px;background:radial-gradient(circle at 50% 40%, var(--amber), var(--orange) 85%)}
  .polaroid:nth-child(2) .ph{background:radial-gradient(circle at 50% 40%, var(--orange), #7d3413 85%)}
  .polaroid:nth-child(3) .ph{background:radial-gradient(circle at 50% 40%, #e6c46a, var(--amber) 85%)}
  .polaroid p{margin-top:10px;font-weight:600;font-size:14px;text-transform:uppercase}
  .polaroid .mono{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
  @media(max-width:860px){.stickers{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="wordmark">IJE</div><a href="#">Pull up</a></nav>
  <section class="hero">
    <div class="stickers" aria-hidden="true">
      <div class="stk s1">No small talk</div>
      <div class="stk s2">6 strangers</div>
      <div class="stk s3">Lagos only</div>
    </div>
    <h1><span class="a">Your new</span><br><span class="b">crew</span> <span class="a">awaits.</span></h1>
    <p class="sub">Dinner with six strangers who dress like your group chat and argue like your cousins.</p>
    <a class="cta" href="#">Pull up Thursday</a>
  </section>
  <section class="crew">
    <h2>Last week's tables</h2>
    <div class="row">
      <div class="polaroid"><div class="ph"></div><div class="mono">Yaba</div><p>The loud table</p></div>
      <div class="polaroid"><div class="ph"></div><div class="mono">VI</div><p>The debate club</p></div>
      <div class="polaroid"><div class="ph"></div><div class="mono">Ikeja</div><p>The quiet storm</p></div>
    </div>
  </section>
</div>
</body>
</html>
