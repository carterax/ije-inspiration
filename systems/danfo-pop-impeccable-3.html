<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danfo Pop / Impeccable V3 Type Blast</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:"Chakra Petch",sans-serif}
  .page{min-height:calc(100dvh - 46px);display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(20px,4vw,44px)}
  nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .wordmark{font-weight:700;font-size:24px}.wordmark b{color:var(--orange)}
  nav a{background:var(--ink);color:var(--cream);padding:10px 22px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:13px;text-transform:uppercase}
  h1{text-transform:uppercase;line-height:.92;font-weight:700;font-size:clamp(56px,12.5vw,175px)}
  h1 .a{color:var(--ink)}
  h1 .b{color:transparent;-webkit-text-stroke:3px var(--ink)}
  h1 .c{color:var(--orange)}
  h1 .d{color:var(--amber);text-shadow:4px 4px 0 var(--ink)}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:28px}
  .sub{font-size:15px;font-weight:600;text-transform:uppercase;max-width:30ch}
  .cta{background:var(--orange);color:var(--cream);font-weight:700;font-size:17px;text-transform:uppercase;
    padding:17px 38px;border-radius:4px;text-decoration:none}
  .cta:hover{background:var(--amber);color:var(--ink)}
  .texture{margin-top:26px;height:84px;border:3px dashed var(--amber);border-radius:4px;display:flex;
    align-items:center;justify-content:center;font-family:"JetBrains Mono";font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;color:#8a6a20}
  .ticker{background:var(--ink);color:var(--amber);font-weight:700;text-transform:uppercase;
    font-size:14px;letter-spacing:.1em;padding:12px 0;white-space:nowrap;overflow:hidden;
    margin:0 calc(-1*clamp(20px,4vw,44px)) calc(-1*clamp(20px,4vw,44px))}
</style>
</head>
<body>
<div class="page">
  <nav><div class="wordmark">IJE<b>.</b></div><a href="#">Get a seat</a></nav>
  <h1>
    <span class="a">Six</span> <span class="b">strangers.</span><br>
    <span class="c">One evening.</span><br>
    <span class="d">See what happens.</span>
  </h1>
  <div class="foot">
    <p class="sub">The best table in Lagos hasn't met yet.</p>
    <a class="cta" href="#">Get a seat</a>
  </div>
  <!-- HIGGSFIELD: [SUBJECT: warm paper grain texture band, amber tint, no people] brand asset. 12:1 -->
  <div class="texture">IMAGE SLOT · paper grain band · 12:1</div>
  <div class="ticker">&nbsp;THURSDAY 7PM · LAGOS · NO SMALL TALK · THURSDAY 7PM · LAGOS · NO SMALL TALK · THURSDAY 7PM · LAGOS · NO SMALL TALK&nbsp;</div>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
