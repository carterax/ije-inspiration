<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danfo Pop / Impeccable</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--surface:#FFFFFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:"Chakra Petch",sans-serif}
  nav{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:var(--cream);
    border-bottom:2px solid var(--ink)}
  .wordmark{font-weight:700;font-size:24px;letter-spacing:.04em}
  .wordmark b{color:var(--orange)}
  nav a{background:var(--amber);color:var(--ink);padding:10px 24px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:14px}
  nav a:hover{background:var(--orange);color:var(--cream)}
  .hero{background:var(--orange);color:var(--cream);padding:72px 32px;display:grid;
    grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;min-height:70dvh}
  h1{font-size:clamp(44px,7vw,92px);line-height:1.02;font-weight:700;text-transform:uppercase}
  h1 span{color:var(--amber)}
  .sub{margin-top:20px;font-size:17px;max-width:36ch;color:#f6e3d3}
  .cta{margin-top:32px;display:inline-block;background:var(--cream);color:var(--orange);font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;padding:15px 32px;border-radius:4px;text-decoration:none;font-size:15px}
  .cta:hover{background:var(--amber);color:var(--ink)}
  .poster{background:var(--cream);border-radius:8px;aspect-ratio:4/5;position:relative;overflow:hidden;max-height:52dvh}
  .poster .face{position:absolute;inset:14%;background:var(--ink);border-radius:46% 46% 40% 40%}
  .poster .face::before,.poster .face::after{content:"";position:absolute;top:36%;width:20%;height:9%;
    background:var(--amber);border-radius:50%}
  .poster .face::before{left:18%}.poster .face::after{right:18%}
  .poster .face i{position:absolute;bottom:24%;left:36%;width:28%;height:5%;background:var(--orange)}
  .meta{position:absolute;bottom:10px;left:14px;font-family:"JetBrains Mono";font-size:11px;color:var(--ink);
    text-transform:uppercase;letter-spacing:.12em}
  .schedule{padding:64px 32px;background:var(--cream)}
  .schedule h2{font-size:clamp(26px,3.4vw,38px);font-weight:700;text-transform:uppercase;margin-bottom:28px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-top:2px solid var(--ink);gap:16px;flex-wrap:wrap}
  .row:last-child{border-bottom:2px solid var(--ink)}
  .row .name{font-weight:600;font-size:19px;text-transform:uppercase}
  .row .day{font-family:"JetBrains Mono";font-size:12px;color:var(--orange);letter-spacing:.1em}
  .row a{color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px}
  .row a:hover{color:var(--orange)}
  @media(max-width:760px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="wordmark">IJE<b>.</b></div><a href="#">Get a seat</a></nav>
<section class="hero">
  <div>
    <h1>Six strangers. <span>One table.</span></h1>
    <p class="sub">Curated dinners across Lagos. We pick the spot and the people. You bring the stories.</p>
    <a class="cta" href="#">Get a seat</a>
  </div>
  <div class="poster" role="img" aria-label="Graphic mask poster">
    <div class="face"><i></i></div>
    <div class="meta">Lagos / Table 06</div>
  </div>
</section>
<section class="schedule">
  <h2>Pick your night</h2>
  <div class="row"><span class="name">Dinner club</span><span class="day">THURSDAY</span><a href="#">Reserve</a></div>
  <div class="row"><span class="name">Card night</span><span class="day">FRIDAY</span><a href="#">Reserve</a></div>
  <div class="row"><span class="name">Rooftop hang</span><span class="day">SATURDAY</span><a href="#">Reserve</a></div>
</section>
</body>
</html>
