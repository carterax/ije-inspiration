<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danfo Pop / Taste</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--yellow:#f2c200;--ink:#191308;--red:#d43d17;--blue:#274690;--cream:#f6efdc}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--yellow);color:var(--ink);font-family:"Space Grotesk",sans-serif;
    background-image:radial-gradient(rgba(25,19,8,.13) 1.2px, transparent 1.2px);background-size:14px 14px}
  .frame{min-height:100dvh;display:flex;flex-direction:column;border:6px solid var(--ink)}
  nav{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:6px solid var(--ink)}
  .wordmark{font-family:Anton;font-size:28px;letter-spacing:.02em}
  .wordmark span{color:var(--red)}
  nav a.seat{background:var(--ink);color:var(--yellow);padding:10px 22px;text-decoration:none;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;font-size:13px}
  nav a.seat:active{transform:translateY(1px)}
  .hero{flex:1;display:grid;grid-template-columns:1.4fr 1fr;align-items:stretch}
  .hero-copy{padding:56px 40px;display:flex;flex-direction:column;justify-content:center}
  h1{font-family:Anton;font-size:clamp(56px,9vw,124px);line-height:.92;text-transform:uppercase}
  h1 .knock{color:var(--cream);-webkit-text-stroke:3px var(--ink);color:transparent}
  .sub{margin-top:22px;font-size:18px;max-width:34ch;font-weight:500}
  .cta{margin-top:34px;display:inline-block;width:max-content;background:var(--red);color:var(--cream);
    font-family:Anton;font-size:20px;text-transform:uppercase;letter-spacing:.04em;padding:16px 34px;
    text-decoration:none;box-shadow:6px 6px 0 var(--ink)}
  .cta:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .hero-art{border-left:6px solid var(--ink);background:var(--red);position:relative;overflow:hidden;min-height:320px}
  .mask{position:absolute;inset:12%;background:var(--blue);
    clip-path:polygon(50% 0, 82% 12%, 88% 55%, 70% 96%, 30% 96%, 12% 55%, 18% 12%)}
  .mask::before,.mask::after{content:"";position:absolute;top:34%;width:22%;height:12%;background:var(--yellow);border-radius:50%}
  .mask::before{left:16%}.mask::after{right:16%}
  .mask i{position:absolute;bottom:22%;left:38%;width:24%;height:6%;background:var(--cream)}
  .strip{border-top:6px solid var(--ink);background:var(--cream);padding:40px 28px}
  .strip h2{font-family:Anton;text-transform:uppercase;font-size:clamp(26px,3.4vw,40px);margin-bottom:24px}
  .nights{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .night{border:3px solid var(--ink);padding:18px;margin:-1.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;display:flex;justify-content:space-between;align-items:baseline;background:var(--cream);
    transition:background .15s}
  .night:hover{background:var(--yellow)}
  .night em{font-style:normal;font-family:"Space Grotesk";font-size:12px;color:var(--red)}
  @media(max-width:760px){.hero{grid-template-columns:1fr}.hero-art{border-left:0;border-top:6px solid var(--ink)}}
</style>
</head>
<body>
<div class="frame">
  <nav><div class="wordmark">IJE<span>*</span></div><a class="seat" href="#">Get a seat</a></nav>
  <div class="hero">
    <div class="hero-copy">
      <h1>Six strangers.<br><span class="knock">One table.</span></h1>
      <p class="sub">Curated dinners across Lagos. We pick the spot and the people. You bring the stories.</p>
      <a class="cta" href="#">Get a seat</a>
    </div>
    <div class="hero-art" role="img" aria-label="Graphic mask illustration"><div class="mask"><i></i></div></div>
  </div>
  <div class="strip">
    <h2>Pick your night</h2>
    <div class="nights">
      <div class="night">Dinner club <em>THU</em></div>
      <div class="night">Card night <em>FRI</em></div>
      <div class="night">Rooftop hang <em>SAT</em></div>
      <div class="night">Market crawl <em>SUN</em></div>
    </div>
  </div>
</div>
</body>
</html>
