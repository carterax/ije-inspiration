<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gele Studio / Impeccable V1 Split Portrait</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--green:#1d4f43;--deep:#143b32}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--green);color:var(--cream);font-family:"Chakra Petch",sans-serif;
    background-image:radial-gradient(1100px 700px at 30% 15%, rgba(247,240,227,.07), transparent 60%)}
  .wrap{max-width:1150px;margin:0 auto;padding:0 36px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid rgba(204,136,0,.4)}
  .wordmark{font-weight:700;font-size:24px;letter-spacing:.2em}
  .wordmark span{color:var(--amber)}
  nav a{background:var(--amber);color:var(--ink);padding:11px 26px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  nav a:hover{background:var(--cream)}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;min-height:72dvh;padding:40px 0}
  .kicker{font-family:"JetBrains Mono";font-size:12px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase}
  h1{margin-top:14px;font-size:clamp(38px,5.4vw,72px);font-weight:700;line-height:1.08;text-transform:uppercase}
  h1 span{color:var(--amber)}
  .sub{margin-top:18px;font-size:16px;font-weight:300;color:#cfddd3;max-width:38ch;line-height:1.65}
  .cta{margin-top:30px;display:inline-block;background:var(--orange);color:var(--cream);padding:15px 32px;
    border-radius:4px;text-decoration:none;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
  .cta:hover{background:var(--amber);color:var(--ink)}
  .frame{justify-self:center;width:min(100%,380px);border:2px solid var(--amber);border-radius:8px;padding:12px;background:var(--deep)}
  .imgslot{aspect-ratio:4/5;border:2px dashed rgba(204,136,0,.6);border-radius:4px;display:flex;
    align-items:center;justify-content:center;text-align:center;font-family:"JetBrains Mono";font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--amber);padding:20px;line-height:1.8}
  .frame p{margin-top:10px;text-align:center;font-family:"JetBrains Mono";font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:#9db3a7}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="wordmark">IJE<span>.</span></div><a href="#">Reserve</a></nav>
  <section class="hero">
    <div>
      <div class="kicker">Lagos, dressed up</div>
      <h1>Come as you are. <span>Leave as a portrait.</span></h1>
      <p class="sub">Six strangers, dressed like it matters. Deep green rooms, gold light. The best table in Lagos hasn't met yet.</p>
      <a class="cta" href="#">Reserve a seat</a>
    </div>
    <div class="frame">
      <!-- HIGGSFIELD: [SUBJECT: a gold gele headwrap tied and displayed on a stand against a saturated deep green wall, no people]
           retro editorial still life, warm amber studio light, film grain. 4:5 -->
      <div class="imgslot">IMAGE SLOT<br>gold gele on a stand, green wall<br>4:5 · no people</div>
      <p>Study in green and gold</p>
    </div>
  </section>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
