<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gele Studio / Taste</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--green:#1d4f43;--green-deep:#143b32;--gold:#c99a4b;--bronze:#8a6531;--pearl:#f1e8d8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--green);color:var(--pearl);font-family:Outfit,sans-serif;
    background-image:radial-gradient(1200px 800px at 30% 20%, rgba(241,232,216,.06), transparent 60%),
      radial-gradient(rgba(20,59,50,.5) 1px, transparent 1px);background-size:auto,5px 5px}
  .wrap{max-width:1150px;margin:0 auto;padding:0 36px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:26px 0}
  .wordmark{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;letter-spacing:.24em}
  nav a{color:var(--green-deep);background:var(--gold);padding:12px 28px;text-decoration:none;font-weight:500;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  nav a:hover{background:var(--pearl)}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;min-height:76dvh;padding:40px 0}
  h1{font-family:"Cormorant Garamond",serif;font-size:clamp(48px,6.6vw,92px);font-weight:500;line-height:1.05}
  h1 em{font-style:italic;color:var(--gold)}
  .sub{margin-top:24px;font-size:16px;font-weight:300;color:#cfddd3;max-width:38ch;line-height:1.7}
  .cta{margin-top:36px;display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:15px 36px;
    text-decoration:none;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  .cta:hover{background:var(--gold);color:var(--green-deep)}
  .portrait{aspect-ratio:4/5;max-height:62dvh;justify-self:center;width:min(100%,400px);position:relative;
    background:var(--green-deep);border:1px solid rgba(201,154,75,.5)}
  .portrait .lace{position:absolute;inset:0;opacity:.5;
    background:radial-gradient(circle 14px at 25% 25%, var(--bronze) 12px, transparent 13px),
      radial-gradient(circle 14px at 75% 25%, var(--bronze) 12px, transparent 13px),
      radial-gradient(circle 14px at 50% 50%, var(--bronze) 12px, transparent 13px),
      radial-gradient(circle 14px at 25% 75%, var(--bronze) 12px, transparent 13px),
      radial-gradient(circle 14px at 75% 75%, var(--bronze) 12px, transparent 13px);
    background-size:120px 120px}
  .portrait .gele{position:absolute;left:50%;top:26%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-6deg);
    background:var(--gold);border-radius:58% 62% 48% 52%}
  .portrait .gele::after{content:"";position:absolute;right:-18%;top:18%;width:44%;height:52%;
    background:var(--bronze);border-radius:40% 60% 55% 45%;transform:rotate(24deg)}
  .portrait .shoulders{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:74%;height:36%;
    background:var(--green);border-radius:50% 50% 0 0;border-top:1px solid var(--gold)}
  .portrait .caption{position:absolute;bottom:-34px;left:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9db3a7}
  .gallery{padding:72px 0 88px;border-top:1px solid rgba(201,154,75,.35)}
  .gallery h2{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,3.6vw,44px);font-weight:500}
  .frames{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
  .frame{aspect-ratio:4/5;border:1px solid rgba(201,154,75,.5);padding:12px;display:flex;flex-direction:column}
  .frame .ph{flex:1;background:linear-gradient(160deg, var(--green-deep), #0e2a24)}
  .frame:nth-child(2) .ph{background:linear-gradient(160deg, #235c4e, var(--green-deep))}
  .frame:nth-child(3) .ph{background:linear-gradient(200deg, var(--green-deep), #1a4a3e)}
  .frame p{margin-top:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  @media(max-width:820px){.hero{grid-template-columns:1fr}.portrait{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="wordmark">IJE</div><a href="#">Reserve</a></nav>
  <section class="hero">
    <div>
      <h1>Come as you are. <em>Leave as a portrait.</em></h1>
      <p class="sub">Dinner with six strangers, dressed like it matters. Deep green rooms, gold light, conversation worth photographing.</p>
      <a class="cta" href="#">Reserve a seat</a>
    </div>
    <div class="portrait" role="img" aria-label="Stylized gele portrait">
      <div class="lace"></div><div class="gele"></div><div class="shoulders"></div>
      <div class="caption">Study in green and gold</div>
    </div>
  </section>
  <section class="gallery">
    <h2>From the studio wall</h2>
    <div class="frames">
      <div class="frame"><div class="ph"></div><p>The gele, tied high</p></div>
      <div class="frame"><div class="ph"></div><p>Pearls and lace</p></div>
      <div class="frame"><div class="ph"></div><p>Gold on green</p></div>
    </div>
  </section>
</div>
</body>
</html>
