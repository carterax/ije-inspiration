<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour Film / Impeccable</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--dusk:#241408}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--dusk);color:var(--cream);font-family:"Chakra Petch",sans-serif}
  .photo{min-height:72dvh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
    background:
      radial-gradient(800px 500px at 50% 96%, rgba(204,136,0,.85), transparent 65%),
      linear-gradient(180deg,#3a2410 0%, #7d4a1a 45%, var(--orange) 82%, var(--amber) 100%)}
  .photo::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
    background:repeating-radial-gradient(circle at 40% 30%, transparent 0 2px, rgba(0,0,0,.6) 2px 3px)}
  .grade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(36,20,8,.6) 0%, transparent 36%)}
  nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:22px clamp(24px,5vw,56px);z-index:3}
  .wordmark{font-weight:600;font-size:20px;letter-spacing:.32em}
  nav a{color:var(--cream);border:1px solid rgba(247,240,227,.6);padding:11px 26px;border-radius:999px;
    text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  nav a:hover{background:var(--cream);color:var(--orange)}
  .hero-copy{position:relative;z-index:2;padding:0 clamp(24px,5vw,56px) 52px;max-width:760px}
  .roll{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#f0cf8e}
  h1{margin-top:12px;font-size:clamp(32px,4.8vw,58px);font-weight:300;line-height:1.18}
  h1 b{font-weight:600}
  .cta{margin-top:26px;display:inline-block;background:var(--cream);color:var(--orange);padding:14px 34px;
    border-radius:999px;text-decoration:none;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .cta:hover{background:var(--amber);color:var(--ink)}
  .contact-sheet{padding:40px clamp(24px,5vw,56px) 64px}
  .contact-sheet h2{font-weight:300;font-size:clamp(22px,2.8vw,32px)}
  .strip{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .neg{aspect-ratio:3/2;border:1px solid rgba(204,136,0,.4);border-radius:4px;position:relative;overflow:hidden}
  .neg:nth-child(1){background:linear-gradient(200deg,#8a5c00,#3a2410)}
  .neg:nth-child(2){background:linear-gradient(160deg,var(--orange),#4a2408)}
  .neg:nth-child(3){background:linear-gradient(180deg,#7d4a1a,var(--dusk))}
  .neg:nth-child(4){background:linear-gradient(220deg,var(--amber),#7d4a1a)}
  .neg span{position:absolute;bottom:8px;left:10px;font-family:"JetBrains Mono";font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:rgba(247,240,227,.85)}
</style>
</head>
<body>
<div class="photo">
  <div class="grade"></div>
  <nav><div class="wordmark">IJE</div><a href="#">Join a roll</a></nav>
  <div class="hero-copy">
    <div class="roll">Roll 07 · Lagos · Golden hour</div>
    <h1>Some nights develop <b>into people you keep.</b></h1>
    <a class="cta" href="#">Join this week's roll</a>
  </div>
</div>
<section class="contact-sheet">
  <h2>Contact sheet, last week</h2>
  <div class="strip">
    <div class="neg"><span>07A · The arrival</span></div>
    <div class="neg"><span>12A · Second course</span></div>
    <div class="neg"><span>19A · The argument</span></div>
    <div class="neg"><span>24A · Nobody left</span></div>
  </div>
</section>
</body>
</html>
