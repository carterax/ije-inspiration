<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Textile / Impeccable V1 Split Stall</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--deep:#8a5c00}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:"Chakra Petch",sans-serif}
  .band{height:20px;background:repeating-conic-gradient(from 45deg, var(--amber) 0 25%, var(--orange) 0 50%) 0 0/40px 40px}
  .wrap{max-width:1150px;margin:0 auto;padding:0 32px 64px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
  .wordmark{font-weight:700;font-size:26px}.wordmark span{color:var(--orange)}
  nav a{background:var(--ink);color:var(--cream);padding:12px 26px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  nav a:hover{background:var(--orange)}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:48px 0;min-height:60dvh}
  h1{font-size:clamp(40px,6vw,78px);font-weight:700;line-height:1.02;text-transform:uppercase}
  h1 .a{color:var(--orange)}
  h1 .b{color:var(--amber)}
  .sub{margin-top:18px;font-size:16px;max-width:36ch;line-height:1.6;color:#4b5563}
  .cta{margin-top:26px;display:inline-block;background:var(--orange);color:var(--cream);padding:15px 32px;
    border-radius:4px;text-decoration:none;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
  .cta:hover{background:var(--amber);color:var(--ink)}
  .stall{justify-self:center;width:min(100%,400px);border:2px solid var(--ink);border-radius:8px;background:#fff;padding:12px}
  .imgslot{aspect-ratio:4/5;border:2px dashed var(--amber);border-radius:4px;display:flex;align-items:center;
    justify-content:center;text-align:center;font-family:"JetBrains Mono";font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:#8a6a20;padding:18px;line-height:1.8}
  .stall p{margin-top:10px;text-align:center;font-family:"JetBrains Mono";font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
  @media(max-width:840px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <nav><div class="wordmark">IJE<span>*</span></div><a href="#">Find your table</a></nav>
  <section class="hero">
    <div>
      <h1><span class="a">Cut from</span><br><span class="b">every cloth.</span></h1>
      <p class="sub">Six strangers, six patterns, one table where they all somehow match. The best table in Lagos hasn't met yet.</p>
      <a class="cta" href="#">Find your table</a>
    </div>
    <div class="stall">
      <!-- HIGGSFIELD: [SUBJECT: stacked bolts of wax print fabric under a market umbrella, warm amber grade, no people]
           vibrant market photography, dense patterns, warm light. 4:5 -->
      <div class="imgslot">IMAGE SLOT<br>ankara bolt stack under market umbrella<br>4:5 · no people</div>
      <p>Balogun, aisle 3</p>
    </div>
  </section>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
