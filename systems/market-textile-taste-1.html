<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Textile / Taste V1 Split Stall</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#243a73;--waxy:#e8b400;--waxr:#c23b22;--waxg:#2c6e49;--cream:#f5efdf;--ink:#1c1817}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:Archivo,sans-serif}
  .band{height:22px;background:repeating-conic-gradient(from 45deg, var(--waxy) 0 25%, var(--indigo) 0 50%) 0 0/44px 44px}
  .wrap{max-width:1150px;margin:0 auto;padding:0 32px 64px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
  .wordmark{font-weight:900;font-size:26px}.wordmark span{color:var(--waxr)}
  nav a{background:var(--indigo);color:var(--cream);padding:12px 26px;text-decoration:none;font-weight:800;
    font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  nav a:hover{background:var(--waxr)}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:48px 0;min-height:64dvh}
  h1{font-size:clamp(42px,6.2vw,82px);font-weight:900;line-height:1;text-transform:uppercase}
  h1 .r{color:var(--waxr)}
  h1 .y{color:var(--waxy);-webkit-text-stroke:2px var(--ink)}
  .sub{margin-top:20px;font-size:16px;font-weight:600;max-width:36ch;line-height:1.6;color:#443c39}
  .cta{margin-top:28px;display:inline-block;background:var(--waxr);color:var(--cream);padding:15px 32px;
    text-decoration:none;font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.08em;
    box-shadow:5px 5px 0 var(--ink)}
  .cta:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .stall{justify-self:center;width:min(100%,420px);border:4px solid var(--ink);background:#fff;padding:12px}
  .imgslot{aspect-ratio:4/5;border:3px dashed var(--ink);display:flex;align-items:center;justify-content:center;
    text-align:center;font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#6d645f;padding:18px;line-height:1.8}
  .stall p{margin-top:10px;text-align:center;font-family:"IBM Plex Mono";font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:#6d645f}
  @media(max-width:840px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <nav><div class="wordmark">IJE<span>*</span></div><a href="#">Find your table</a></nav>
  <section class="hero">
    <div>
      <h1><span class="r">Cut from</span><br><span class="y">every cloth.</span></h1>
      <p class="sub">Six strangers, six patterns, one table where they all somehow match. The best table in Lagos hasn't met yet.</p>
      <a class="cta" href="#">Find your table</a>
    </div>
    <div class="stall">
      <!-- HIGGSFIELD: [SUBJECT: stacked bolts of African wax print fabric in indigo, yellow, red and green under a market umbrella, no people]
           vibrant market stall photography, dense ankara patterns, warm natural light, saturated joyful color. 4:5 -->
      <div class="imgslot">IMAGE SLOT<br>ankara bolt stack under market umbrella<br>4:5 · no people</div>
      <p>Balogun, aisle 3</p>
    </div>
  </section>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
