<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Mask / Taste V3 Type Unmasked</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--void:#141210;--bone:#e5ddcc;--terra:#a8532f;--stone:#4d4437}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--void);color:var(--bone);font-family:Sora,sans-serif}
  .page{min-height:calc(100dvh - 46px);display:flex;flex-direction:column;padding:0 clamp(24px,6vw,72px);
    position:relative;overflow:hidden}
  .beam{position:absolute;left:8%;top:-20%;width:340px;height:150%;transform:rotate(16deg);pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(229,221,204,.07) 45%, rgba(229,221,204,.07) 55%, transparent)}
  nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;position:relative;z-index:1}
  .wordmark{font-weight:600;font-size:20px;letter-spacing:.3em}
  nav a{border:1px solid var(--bone);color:var(--bone);padding:11px 26px;text-decoration:none;font-size:13px;
    letter-spacing:.12em;text-transform:uppercase}
  nav a:hover{background:var(--bone);color:var(--void)}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
  h1{font-weight:200;font-size:clamp(40px,6.8vw,96px);line-height:1.1;max-width:16ch}
  h1 .mask{color:var(--stone)}
  h1 .true{font-weight:600;color:var(--bone)}
  h1 .true em{font-style:normal;color:var(--terra)}
  .sub{margin-top:24px;font-size:15px;color:#a79e8c;font-weight:300;max-width:42ch;line-height:1.7}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
    padding:30px 0 38px;position:relative;z-index:1}
  .mono{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8a8172}
  .cta{background:var(--terra);color:var(--bone);padding:15px 36px;text-decoration:none;font-size:13px;
    letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .cta:hover{background:var(--bone);color:var(--void)}
</style>
</head>
<body>
<div class="page">
  <div class="beam" aria-hidden="true"></div>
  <nav><div class="wordmark">IJE</div><a href="#">Take a seat</a></nav>
  <section class="hero">
    <h1>
      <span class="mask">Fine, thanks. Busy week. You know how it is.</span><br>
      <span class="true">Now say the <em>true thing.</em></span>
    </h1>
    <p class="sub">Six strangers, one table, zero rehearsed answers. Lagos, Thursday, 7 PM.</p>
  </section>
  <div class="foot">
    <span class="mono">Museum of dropped masks · Est. 2026</span>
    <a class="cta" href="#">Take a seat</a>
  </div>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
