<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papercut / Impeccable V1 Split Scraps</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--surface:#FFFFFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:"Chakra Petch",sans-serif;overflow-x:hidden}
  .wrap{max-width:1150px;margin:0 auto;padding:0 32px 64px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:2px solid var(--ink)}
  .wordmark{font-weight:700;font-size:22px;background:var(--amber);padding:4px 12px;transform:rotate(-1.6deg);display:inline-block}
  nav a{background:var(--ink);color:var(--cream);padding:11px 24px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:14px}
  nav a:hover{background:var(--orange)}
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:44px 0;min-height:60dvh}
  h1{font-size:clamp(36px,5.4vw,70px);font-weight:700;line-height:1.08;text-transform:uppercase}
  h1 .scrap{display:inline-block;padding:7px 18px;margin:5px 0}
  h1 .a{background:var(--surface);transform:rotate(-1.4deg);clip-path:polygon(1% 6%, 99% 0, 100% 92%, 2% 100%)}
  h1 .b{background:var(--amber);transform:rotate(1deg);clip-path:polygon(0 0, 100% 8%, 98% 100%, 1% 94%)}
  .sub{margin-top:20px;font-size:16px;max-width:36ch;color:#4b5563;background:var(--surface);display:inline-block;
    padding:13px 17px;transform:rotate(.5deg);box-shadow:2px 3px 0 rgba(17,24,39,.12)}
  .cta{margin-top:24px;display:block;width:max-content;background:var(--orange);color:var(--cream);font-weight:700;
    text-transform:uppercase;padding:15px 30px;text-decoration:none;font-size:15px;border-radius:4px;transform:rotate(-.8deg)}
  .cta:hover{background:var(--amber);color:var(--ink);transform:rotate(0)}
  .pile{justify-self:center;width:min(100%,420px);position:relative;aspect-ratio:4/5}
  .imgslot{position:absolute;background:var(--surface);padding:10px;box-shadow:3px 4px 0 rgba(17,24,39,.12);border-radius:3px}
  .imgslot i{display:flex;align-items:center;justify-content:center;border:2px dashed var(--amber);
    font-style:normal;font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#8a6a20;text-align:center;padding:10px;width:100%;height:100%}
  .sl1{width:62%;aspect-ratio:3/4;left:0;top:4%;transform:rotate(-4deg)}
  .sl2{width:52%;aspect-ratio:1;right:0;top:0;transform:rotate(5deg)}
  .sl3{width:58%;aspect-ratio:4/3;right:6%;bottom:2%;transform:rotate(-2deg)}
  @media(max-width:840px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="wordmark">IJE</div><a href="#">Add your piece</a></nav>
  <section class="hero">
    <div>
      <h1><span class="scrap a">Different scraps.</span><br><span class="scrap b">One picture.</span></h1>
      <p class="sub">Six strangers pieced together over dinner in Lagos. The edges don't have to match.</p>
      <a class="cta" href="#">Add your piece</a>
    </div>
    <!-- HIGGSFIELD per slot: torn-edged photo scraps, warm amber grade, no people -->
    <div class="pile" aria-label="Collage of image slots">
      <div class="imgslot sl1"><i>SLOT · torn kraft paper macro · 3:4</i></div>
      <div class="imgslot sl2"><i>SLOT · collage elements flat lay · 1:1</i></div>
      <div class="imgslot sl3"><i>SLOT · six plates overhead, torn edges · 4:3</i></div>
    </div>
  </section>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
