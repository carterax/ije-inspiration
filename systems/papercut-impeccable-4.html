<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papercut / Impeccable V4 Photo Collage</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--surface:#FFFFFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:"Chakra Petch",sans-serif;overflow-x:hidden}
  .wrap{max-width:1150px;margin:0 auto;padding:0 32px 72px}
  nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
  .wordmark{font-weight:700;font-size:22px;background:var(--amber);padding:4px 12px;transform:rotate(-1.6deg);display:inline-block}
  nav a{background:var(--ink);color:var(--cream);padding:11px 24px;border-radius:4px;text-decoration:none;
    font-weight:600;font-size:14px}
  .canvas{position:relative;min-height:74dvh;margin-top:16px}
  .headline{position:absolute;left:0;top:34%;z-index:3;max-width:52%}
  h1{font-size:clamp(32px,4.8vw,58px);font-weight:700;line-height:1.08;text-transform:uppercase;
    background:var(--surface);display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;
    padding:6px 14px;box-shadow:3px 4px 0 rgba(17,24,39,.14)}
  h1 em{font-style:normal;color:var(--orange)}
  .cta{position:absolute;left:0;top:calc(34% + 140px);z-index:3;background:var(--orange);color:var(--cream);
    font-weight:700;text-transform:uppercase;padding:15px 30px;text-decoration:none;font-size:15px;
    border-radius:4px;transform:rotate(-1deg)}
  .cta:hover{background:var(--amber);color:var(--ink);transform:rotate(0)}
  .shard{position:absolute;background:var(--surface);padding:10px;box-shadow:4px 5px 0 rgba(17,24,39,.14);border-radius:3px}
  .shard i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
    border:2px dashed var(--amber);font-style:normal;font-family:"JetBrains Mono";font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:#8a6a20;text-align:center;padding:10px}
  .h1{width:34%;aspect-ratio:3/4;right:22%;top:0;transform:rotate(4deg)}
  .h2{width:26%;aspect-ratio:1;right:0;top:14%;transform:rotate(-6deg)}
  .h3{width:30%;aspect-ratio:4/3;right:30%;bottom:10%;transform:rotate(-3deg)}
  .h4{width:24%;aspect-ratio:3/4;right:2%;bottom:0;transform:rotate(5deg)}
  .h5{width:20%;aspect-ratio:1;left:38%;top:2%;transform:rotate(-7deg)}
  @media(max-width:820px){.canvas{min-height:0;display:flex;flex-direction:column;gap:18px}
    .headline,.cta{position:static;max-width:100%}
    .shard{position:static;width:100%!important;transform:none!important;aspect-ratio:4/3}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="wordmark">IJE</div><a href="#">Add your piece</a></nav>
  <!-- HIGGSFIELD per shard: torn-edged photo scrap, warm amber grade, analog print texture, no people -->
  <section class="canvas">
    <div class="headline"><h1>Torn from <em>the same city.</em></h1></div>
    <a class="cta" href="#">Add your piece</a>
    <div class="shard h1"><i>SLOT · danfo detail, torn scrap · 3:4</i></div>
    <div class="shard h2"><i>SLOT · jollof pot overhead · 1:1</i></div>
    <div class="shard h3"><i>SLOT · cards on wood table · 4:3</i></div>
    <div class="shard h4"><i>SLOT · string lights at night · 3:4</i></div>
    <div class="shard h5"><i>SLOT · torn newsprint texture · 1:1</i></div>
  </section>
</div>
<script src="variants-nav.js"></script>
</body>
</html>
