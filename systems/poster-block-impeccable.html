<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Block / Impeccable</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--amber:#CC8800;--orange:#C55221;--cream:#F7F0E3;--ink:#111827;--surface:#FFFFFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Chakra Petch",sans-serif;background:var(--cream)}
  .block{min-height:82dvh;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;
    padding:48px clamp(24px,6vw,80px);gap:40px}
  h1,h2{font-size:clamp(48px,7.4vw,108px);line-height:1;text-transform:uppercase;font-weight:700}
  .kick{font-size:15px;margin-top:22px;max-width:32ch;text-transform:uppercase;font-weight:500;letter-spacing:.03em}
  .cta{margin-top:30px;display:inline-block;padding:14px 30px;border-radius:4px;text-decoration:none;
    font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
  .b1{background:var(--orange);color:var(--cream)}
  .b1 .cta{background:var(--cream);color:var(--orange)}
  .b1 .cta:hover{background:var(--amber);color:var(--ink)}
  .b1 .art{aspect-ratio:1;width:min(100%,400px);justify-self:center;position:relative}
  .b1 .plate{position:absolute;inset:8%;border-radius:50%;background:var(--cream)}
  .b1 .plate::after{content:"";position:absolute;inset:14%;border-radius:50%;border:3px solid var(--amber)}
  .b2{background:var(--ink);color:var(--cream)}
  .b2 h2 span{color:var(--amber)}
  .b2 .cta{background:var(--amber);color:var(--ink)}
  .b2 .cta:hover{background:var(--cream)}
  .b2 .art{aspect-ratio:1;width:min(100%,400px);justify-self:center;position:relative}
  .b2 .grid{position:absolute;inset:10%;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .b2 .grid div{border-radius:8px}
  .b2 .grid div:nth-child(1){background:var(--amber)}
  .b2 .grid div:nth-child(2){background:var(--orange)}
  .b2 .grid div:nth-child(3){background:var(--cream)}
  .b2 .grid div:nth-child(4){background:var(--orange)}
  .b3{background:var(--cream);color:var(--ink);text-align:center;padding:80px 24px;display:block;min-height:auto}
  .b3 h2{font-size:clamp(40px,5.6vw,84px)}
  .b3 h2 span{color:var(--orange)}
  .b3 p{margin-top:16px;font-family:"JetBrains Mono";font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#4b5563}
  .b3 .cta{background:var(--orange);color:var(--cream)}
  .b3 .cta:hover{background:var(--amber);color:var(--ink)}
  @media(max-width:800px){.block{grid-template-columns:1fr;min-height:64dvh}}
</style>
</head>
<body>
<section class="block b1">
  <div>
    <h1>Choose<br>your night</h1>
    <p class="kick">For those who know what they want.</p>
    <a class="cta" href="#">See the lineup</a>
  </div>
  <div class="art" role="img" aria-label="Plate illustration"><div class="plate"></div></div>
</section>
<section class="block b2">
  <div>
    <h2>Meet <span>your people</span></h2>
    <p class="kick">Your chosen family. People who get you.</p>
    <a class="cta" href="#">Join the table</a>
  </div>
  <div class="art" role="img" aria-label="Color block grid"><div class="grid"><div></div><div></div><div></div><div></div></div></div>
</section>
<section class="block b3">
  <h2>Take a <span>seat</span></h2>
  <p>Thursday / 7 PM / Somewhere good in Lagos</p>
  <a class="cta" href="#">Get a seat</a>
</section>
</body>
</html>
